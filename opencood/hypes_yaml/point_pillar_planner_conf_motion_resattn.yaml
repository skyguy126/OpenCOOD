name: point_pillar_planner_conf_motion_resattn
# Experiment 3: same 8-ch motion as Exp 2 + residual spatial attention pooling.
# ONLY difference vs Exp 2 is pooling: residual_attention (alpha~0.10 init).
# Frozen velocity backbone x2_multiframe epoch 15. No DDP (single GPU).
#   --pretrained_dir /home/project/x2_multiframe
#   --model_dir /home/project/path_v2xverse_conf_motion_resattn
root_dir: "/media/Disk2/data/OPV2V/opv2v_data_dumping/train"
validate_dir: "/home/project/validate/validate"

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 2
  epoches: 50
  eval_freq: 0
  save_freq: 1
  freeze_backbone: true
  pretrained_dir: "/home/project/x2_multiframe"
  pretrained_epoch: 15
  gradient_clip_norm: 10
  num_workers: 8
  val_num_workers: 2
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  val_persistent_workers: false
  max_workers_per_rank_train: 4
  max_workers_per_rank_val: 2

fusion:
  core_method: 'EarlyFusionDataset'
  args: []

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    num_point_features: 4
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

data_augment: []

postprocess:
  core_method: 'VoxelPostprocessor'
  box_code_size: 8
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    num: &achor_num 2
    box_code_size: 8
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
    speed_norm: 30.0
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_v2xverse_mean
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    box_code_size: 8
    dual_frame: true
    history_frames: 5
    freeze_backbone: true
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_point_features: 4
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    anchor_num: *achor_num
    planning_head:
      enabled: true
      type: v2xverse
      motion_mode: confidence_gated_speed
      pooling: residual_attention
      bev_channels: 384
      feature_dir: 128
      input_frame: 5
      num_waypoints: 10

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0
    speed_weight: 2.0
    box_code_size: 8
    enable_planning: true
    planning_only: true
    planning_weight: 1.0
    planning_loss_type: l1

optimizer:
  core_method: AdamW
  lr: 0.0001
  args:
    eps: 1.0e-8
    weight_decay: 0.0005

lr_scheduler:
  core_method: CosineAnnealingLR
  T_max: 50
  eta_min: 1.0e-6
